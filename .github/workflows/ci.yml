name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # hexpat binds to the C library expat, which the macOS SDK already provides.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev

      # GHC links against the Command Line Tools SDK, which the default Xcode's older ld cannot read.
      # Remove once https://github.com/actions/runner-images/issues/14940 is fixed.
      - name: Use the Command Line Tools toolchain
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true

      # stack.yaml.lock is gitignored, so the cache is keyed on the inputs it is derived from.
      # .stack-work is not cached: rebuilding lightblue itself takes under a minute.
      - uses: actions/cache@v6
        with:
          path: ~/.stack
          key: stack-${{ runner.os }}-${{ hashFiles('stack.yaml', 'package.yaml') }}
          restore-keys: stack-${{ runner.os }}-

      # Build the library, the executables and the test suites (without running them),
      # so that every test suite at least compiles on both platforms.
      - name: Build
        run: stack build --test --no-run-tests

      # testJumanDicSettings is an environment check (it needs config.yaml and the local
      # JUMAN / Kyoto case frame files, which are not in the repository), so only typeCheck runs here.
      - name: Test
        run: stack test lightblue:test:typeCheck

  # Checks for AI-policy.md. A separate light job, so that it runs even when the build fails.
  ai-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # CLAUDE.md (Claude Code) and AGENTS.md (Codex etc.) must stay identical (see AI-policy.md).
      - name: Check that CLAUDE.md and AGENTS.md are identical
        run: cmp CLAUDE.md AGENTS.md

      # The AI-policy tags are self-declared (see AI-policy.md); this checks what can be checked mechanically.
      # A mixed module without marks is allowed (it leaves room for AI code to come).
      - name: Check AI-policy tags
        run: |
          set -u
          fail=0
          # Anything that looks like a tag line, in any case and even behind "--" (to catch malformed ones).
          loose='^[[:space:]]*(--+[[:space:]]*)?ai[-_ ]?policy[[:space:]]*:'
          strict='^[[:space:]]*AI-policy[[:space:]]*:[[:space:]]*(human-code|mixed|AI-generated)[[:space:]]*$'
          mark='^[[:space:]]*-- \| @AI-generated'
          while IFS= read -r -d '' f; do
            n_all=$(grep -ciE "$loose" "$f" || true)
            [ "$n_all" -eq 0 ] && continue   # unmarked
            # The header is the first {-| ... -} block.
            header=$(awk '!h && /^[[:space:]]*\{-\|/ {h=1} h {print} h && /-\}/ {exit}' "$f")
            n_hdr=$(printf '%s\n' "$header" | grep -cE "$strict" || true)
            if [ "$n_all" -ne 1 ] || [ "$n_hdr" -ne 1 ]; then
              echo "$f: the header must contain exactly one AI-policy line of the form 'AI-policy   : human-code|mixed|AI-generated'"
              grep -inE "$loose" "$f"
              fail=1
              continue
            fi
            # A human-code or AI-generated module must not contain @AI-generated marks.
            if printf '%s\n' "$header" | grep -qE 'AI-policy[[:space:]]*:[[:space:]]*(human-code|AI-generated)' \
               && grep -qE "$mark" "$f"; then
              echo "$f: the tag forbids per-declaration marks"
              grep -nE "$mark" "$f"
              fail=1
            fi
          done < <(git ls-files -z -- '*.hs')
          exit $fail
