name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # hexpat binds to the C library expat, which the macOS SDK already provides.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev

      # GHC links against the Command Line Tools SDK, which the default Xcode's older ld cannot read.
      # Remove once https://github.com/actions/runner-images/issues/14940 is fixed.
      - name: Use the Command Line Tools toolchain
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true

      # stack.yaml.lock is gitignored, so the cache is keyed on the inputs it is derived from.
      # .stack-work is not cached: rebuilding lightblue itself takes under a minute.
      - uses: actions/cache@v6
        with:
          path: ~/.stack
          key: stack-${{ runner.os }}-${{ hashFiles('stack.yaml', 'package.yaml') }}
          restore-keys: stack-${{ runner.os }}-

      # Build the library, the executables and the test suites (without running them),
      # so that every test suite at least compiles on both platforms.
      - name: Build
        run: stack build --test --no-run-tests

      # testJumanDicSettings is an environment check (it needs config.yaml and the local
      # JUMAN / Kyoto case frame files, which are not in the repository), so only typeCheck runs here.
      - name: Test
        run: stack test lightblue:test:typeCheck

      # CLAUDE.md (Claude Code) and AGENTS.md (Codex etc.) must stay identical.
      # The check only applies once either file exists on the branch.
      - name: Check that CLAUDE.md and AGENTS.md are identical
        if: runner.os == 'Linux'
        run: |
          if [ -f CLAUDE.md ] || [ -f AGENTS.md ]; then
            cmp CLAUDE.md AGENTS.md
          fi
